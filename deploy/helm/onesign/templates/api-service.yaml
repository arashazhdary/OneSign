apiVersion: v1
kind: Service
metadata:
  name: {{ include "onesign.fullname" . }}-api
  labels:
    {{- include "onesign.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
      name: http
