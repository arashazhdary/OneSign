apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onesign.fullname" . }}-admin
  labels:
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: admin
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admin
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.admin.service.port }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onesign.fullname" . }}-admin
spec:
  selector:
    app.kubernetes.io/component: admin
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.admin.service.port }}
      targetPort: {{ .Values.admin.service.port }}
