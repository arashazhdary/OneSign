apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onesign.fullname" . }}-login
  labels:
    app.kubernetes.io/component: login
spec:
  replicas: {{ .Values.login.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: login
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: login
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: login
          image: "{{ .Values.login.image.repository }}:{{ .Values.login.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.login.service.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://{{ include "onesign.fullname" . }}-api:{{ .Values.api.service.port }}"

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onesign.fullname" . }}-login
spec:
  selector:
    app.kubernetes.io/component: login
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.login.service.port }}
      targetPort: {{ .Values.login.service.port }}
