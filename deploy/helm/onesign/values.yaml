global:
  imagePullPolicy: IfNotPresent

ingress:
  enabled: true
  className: nginx
  hosts:
    api: api.onesign.local
    admin: admin.onesign.local
    login: login.onesign.local
  tls: false

config:
  aspnetEnvironment: Production
  emailProvider: Null
  sqlServerHost: sqlserver

secrets:
  sqlPassword: changeme
  jwtSecret: changeme-use-long-random-string
  emailSendGridApiKey: ""
  smtpPassword: ""

sqlServer:
  enabled: false
  image: mcr.microsoft.com/mssql/server:2022-latest
  saPassword: changeme

api:
  replicaCount: 2
  image:
    repository: onesign/api
    tag: latest
  service:
    port: 8080
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

admin:
  replicaCount: 2
  image:
    repository: onesign/admin
    tag: latest
  service:
    port: 80

login:
  replicaCount: 2
  image:
    repository: onesign/login
    tag: latest
  service:
    port: 3000
