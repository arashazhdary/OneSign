name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Type Check و Lint
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: onesign-admin-portal-react/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-admin-portal-react
        run: npm ci

      - name: Type check
        working-directory: ./onesign-admin-portal-react
        run: npm run type-check

      - name: Lint
        working-directory: ./onesign-admin-portal-react
        run: npm run lint

      - name: Format check
        working-directory: ./onesign-admin-portal-react
        run: npm run format:check

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: onesign-admin-portal-react/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-admin-portal-react
        run: npm ci

      - name: Run unit tests
        working-directory: ./onesign-admin-portal-react
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./onesign-admin-portal-react/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  # Job 3: E2E Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: onesign-admin-portal-react/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-admin-portal-react
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./onesign-admin-portal-react
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: ./onesign-admin-portal-react
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: onesign-admin-portal-react/playwright-report/
          retention-days: 30

  # Job 4: Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality-check, unit-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: onesign-admin-portal-react/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-admin-portal-react
        run: npm ci

      - name: Build production
        working-directory: ./onesign-admin-portal-react
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: onesign-admin-portal-react/dist/
          retention-days: 7

  # Job 5: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        working-directory: ./onesign-admin-portal-react
        run: npm audit --audit-level=high

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=onesign-admin-portal-react/package.json

  # Job 6: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.onesign.com

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: ./dist

      - name: Deploy to Vercel/Netlify
        run: |
          # Add your deployment script here
          echo "Deploying to staging..."
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Job 7: Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, e2e-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://admin.onesign.com

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: ./dist

      - name: Deploy to Production
        run: |
          # Add your deployment script here
          echo "Deploying to production..."
          # npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production

  # Job 8: Lighthouse Performance
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://staging.onesign.com
            https://staging.onesign.com/login
            https://staging.onesign.com/dashboard
          uploadArtifacts: true
          temporaryPublicStorage: true
