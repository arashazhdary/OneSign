<svg width="300" height="120" viewBox="0 0 300 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="checkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Number 1 -->
  <text x="30" y="70" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="700" fill="#1e293b">1</text>

  <!-- Circle O with checkmark -->
  <circle cx="105" cy="45" r="32" stroke="#1e293b" stroke-width="8" fill="none"/>

  <!-- Checkmark inside circle -->
  <path d="M85 45 L98 58 L125 28" stroke="url(#checkGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ONESIGN text -->
  <text x="30" y="105" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" letter-spacing="0.1em" fill="#1e293b">ONESIGN</text>
</svg>