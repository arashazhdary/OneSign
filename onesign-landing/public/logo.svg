<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main Circle Background -->
  <circle cx="100" cy="100" r="85" fill="url(#logoGradient)" filter="url(#shadow)" opacity="0.1"/>

  <!-- Shield Shape (representing Security) -->
  <path d="M100 30 L140 45 L140 90 C140 115 125 135 100 145 C75 135 60 115 60 90 L60 45 Z"
        fill="url(#logoGradient)"
        filter="url(#shadow)"/>

  <!-- Check Mark (representing Sign/Signature) -->
  <path d="M85 95 L95 105 L115 75"
        stroke="white"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- "One" Ring -->
  <circle cx="100" cy="100" r="70"
          stroke="url(#logoGradient2)"
          stroke-width="3"
          fill="none"
          opacity="0.5"
          stroke-dasharray="220 440"
          transform="rotate(-90 100 100)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 100 100"
      to="360 100 100"
      dur="20s"
      repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Dots -->
  <circle cx="100" cy="30" r="4" fill="url(#logoGradient2)" opacity="0.8"/>
  <circle cx="140" cy="60" r="3" fill="url(#logoGradient2)" opacity="0.6"/>
  <circle cx="60" cy="60" r="3" fill="url(#logoGradient2)" opacity="0.6"/>
</svg>
