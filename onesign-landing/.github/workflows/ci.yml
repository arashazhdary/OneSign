name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-landing
        run: npm ci

      - name: Run ESLint
        working-directory: ./onesign-landing
        run: npm run lint
        continue-on-error: true

      - name: Build application
        working-directory: ./onesign-landing
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node-version }}
          path: onesign-landing/.next
          retention-days: 7

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./onesign-landing
        run: |
          docker build -t onesign-landing:test .

      - name: Test Docker image
        run: |
          docker run -d -p 3001:3001 --name landing-test onesign-landing:test
          sleep 10
          curl -f http://localhost:3001/api/health || exit 1
          docker stop landing-test
