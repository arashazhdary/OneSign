name: Test Suite

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-landing
        run: npm ci

      - name: Run tests
        working-directory: ./onesign-landing
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: ./onesign-landing/coverage
          flags: unittests
          name: coverage-${{ matrix.node-version }}

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-landing
        run: npm ci

      - name: Build application
        working-directory: ./onesign-landing
        run: npm run build

      - name: Start server
        working-directory: ./onesign-landing
        run: npm start &

      - name: Wait for server
        run: sleep 10

      - name: Run Pa11y accessibility tests
        run: |
          npx pa11y http://localhost:3001/en/landing --threshold 10
          npx pa11y http://localhost:3001/fa/landing --threshold 10
