name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-landing
        run: npm ci

      - name: Build application
        working-directory: ./onesign-landing
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        working-directory: ./onesign-landing
        run: |
          docker build -t ${{ secrets.REGISTRY_URL }}/onesign-landing:${{ github.sha }} .
          docker build -t ${{ secrets.REGISTRY_URL }}/onesign-landing:latest .
          docker push ${{ secrets.REGISTRY_URL }}/onesign-landing:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_URL }}/onesign-landing:latest

      - name: Deploy to Kubernetes
        if: github.event.inputs.environment == 'production'
        run: |
          # Configure kubectl
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

          # Update deployment
          kubectl set image deployment/onesign-landing \
            landing=${{ secrets.REGISTRY_URL }}/onesign-landing:${{ github.sha }} \
            -n onesign-landing

          # Wait for rollout
          kubectl rollout status deployment/onesign-landing -n onesign-landing

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.APP_URL }}/api/health || exit 1

      - name: Notify deployment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ job.status }}',
              target_url: '${{ secrets.APP_URL }}',
              description: 'Deployment ${{ job.status }}',
              context: 'deployment/${{ github.event.inputs.environment || "staging" }}'
            })
