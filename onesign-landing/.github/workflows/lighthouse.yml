name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    name: Run Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install dependencies
        working-directory: ./onesign-landing
        run: npm ci

      - name: Build application
        working-directory: ./onesign-landing
        run: npm run build

      - name: Start server
        working-directory: ./onesign-landing
        run: npm start &
        env:
          PORT: 3001

      - name: Wait for server
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3001/api/health; do sleep 2; done'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3001/en/landing
            http://localhost:3001/fa/landing
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ./onesign-landing/lighthouse-budget.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci
