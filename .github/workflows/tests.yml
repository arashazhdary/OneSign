name: Tests

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Onesign.Api.Tests/Onesign.Api.Tests.csproj

    - name: Build
      run: dotnet build src/Onesign.Api.Tests/Onesign.Api.Tests.csproj --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test src/Onesign.Api.Tests/Onesign.Api.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-test-results.trx" --collect:"XPlat Code Coverage"

    - name: Upload Unit Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: '**/TestResults/**/*.trx'

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-coverage
        path: '**/TestResults/**/coverage.cobertura.xml'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: YourStrong@Passw0rd!
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd!' -Q 'SELECT 1' -C"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj

    - name: Build
      run: dotnet build src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-restore --configuration Release

    - name: Run Integration Tests
      run: dotnet test src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx" --collect:"XPlat Code Coverage"
      env:
        ConnectionStrings__DefaultConnection: "Server=localhost;Database=OnesignTest;User Id=sa;Password=YourStrong@Passw0rd!;TrustServerCertificate=True"

    - name: Upload Integration Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: '**/TestResults/**/*.trx'

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj

    - name: Build
      run: dotnet build src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-restore --configuration Release

    - name: Run Security Tests
      run: dotnet test src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~Security" --logger "trx;LogFileName=security-test-results.trx"

    - name: Upload Security Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-test-results
        path: '**/TestResults/**/*.trx'

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj

    - name: Build
      run: dotnet build src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-restore --configuration Release

    - name: Run Performance Tests
      run: dotnet test src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~Performance" --logger "trx;LogFileName=performance-test-results.trx"

    - name: Upload Performance Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: '**/TestResults/**/*.trx'

  code-coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Download Unit Test Coverage
      uses: actions/download-artifact@v4
      with:
        name: unit-test-coverage
        path: coverage/unit

    - name: Generate Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: 'coverage/**/*.xml'
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline;Cobertura;MarkdownSummary'

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coveragereport

    - name: Publish Coverage Summary
      run: cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-tests]
    if: always()

    steps:
    - name: Check Test Results
      run: |
        if [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ] || \
           [ "${{ needs.security-tests.result }}" != "success" ]; then
          echo "One or more test jobs failed"
          exit 1
        fi
        echo "All tests passed!"
