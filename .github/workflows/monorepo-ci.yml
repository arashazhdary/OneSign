name: Monorepo CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build API
        run: dotnet build src/Onesign.Api/Onesign.Api.csproj -c Release

      - name: Integration tests (in-memory)
        run: dotnet test src/Onesign.IntegrationTests/Onesign.IntegrationTests.csproj -c Release --verbosity minimal

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-trx
          path: '**/TestResults/**/*.trx'

  admin-portal:
    name: Admin Portal (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: onesign-admin-portal-react/package-lock.json

      - name: Install & build
        working-directory: onesign-admin-portal-react
        run: |
          npm ci
          npx vite build
        env:
          VITE_API_URL: http://localhost:7000

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-portal-dist
          path: onesign-admin-portal-react/dist/

  login-portal:
    name: Login Portal (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: onesign-login-portal/package-lock.json

      - name: Install & build
        working-directory: onesign-login-portal
        run: |
          npm ci
          npm run build

  landing:
    name: Landing (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: onesign-landing/package-lock.json

      - name: Install & build
        working-directory: onesign-landing
        run: |
          npm ci
          npm run build

  ci-success:
    name: All components
    runs-on: ubuntu-latest
    needs: [backend, admin-portal, login-portal, landing]
    if: always()
    steps:
      - name: Verify jobs
        run: |
          for job in backend admin-portal login-portal landing; do
            result="${{ needs[job].result }}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
